# Runs the engine checks (astronomy, 4,000-chart cross-check, reading variety, copy rules).
name: Engine checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "04 Source Code/fortune-cookie"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "04 Source Code/fortune-cookie/package-lock.json"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
